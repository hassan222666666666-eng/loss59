<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081631" />
      <stop offset="55%" stop-color="#0B2D48" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Modern Midnight-Navy to Teal Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="64" y="64" width="384" height="384" rx="88" fill="#081631" />

  <!-- Glowing Scan Brackets -->
  <g fill="none" stroke="url(#mintGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path d="M 122 184 L 122 142 Q 122 126 138 126 L 180 126" />
    <path d="M 390 328 L 390 370 Q 390 386 374 386 L 332 386" />
  </g>

  <!-- Minimalist Shelf & Items -->
  <g filter="url(#softGlow)">
    <!-- Top Row -->
    <rect x="150" y="150" width="28" height="88" rx="6" fill="url(#mintGrad)" />
    <rect x="188" y="150" width="76" height="28" rx="6" fill="url(#mintGrad)" />
    <rect x="188" y="186" width="34" height="52" rx="6" fill="url(#mintGrad)" />
    <rect x="230" y="186" width="34" height="52" rx="6" fill="url(#mintGrad)" />
    <rect x="274" y="180" width="30" height="58" rx="6" fill="#F8FAFC" />
    <rect x="314" y="150" width="28" height="40" rx="6" fill="#F8FAFC" />
    <rect x="314" y="198" width="28" height="40" rx="6" fill="#F8FAFC" />
    <rect x="350" y="170" width="24" height="30" rx="5" fill="url(#mintGrad)" />
    <rect x="350" y="208" width="24" height="30" rx="5" fill="url(#mintGrad)" />

    <!-- Top Shelf Bar -->
    <rect x="140" y="244" width="244" height="14" rx="7" fill="url(#mintGrad)" />

    <!-- Bottom Row -->
    <rect x="150" y="272" width="36" height="60" rx="6" fill="#F8FAFC" />
    <rect x="194" y="272" width="36" height="60" rx="6" fill="#F8FAFC" />
    <rect x="238" y="272" width="28" height="60" rx="6" fill="url(#mintGrad)" />
    <rect x="274" y="294" width="26" height="38" rx="6" fill="url(#mintGrad)" />
    <rect x="308" y="290" width="34" height="42" rx="6" fill="#F8FAFC" />
    <rect x="350" y="272" width="24" height="26" rx="5" fill="url(#mintGrad)" />
    <rect x="350" y="306" width="24" height="26" rx="5" fill="#F8FAFC" />

    <!-- Bottom Shelf Bar -->
    <rect x="140" y="338" width="244" height="14" rx="7" fill="url(#mintGrad)" />
  </g>
</svg>
