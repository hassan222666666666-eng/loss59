<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  <!-- Supermarket Shelf Restock Icon -->
  <g fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Shelf -->
    <line x1="96" y1="180" x2="416" y2="180" />
    <!-- Shelf Items Row 1 -->
    <rect x="120" y="100" width="60" height="80" rx="8" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="200" y="80" width="70" height="100" rx="8" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="290" y="110" width="50" height="70" rx="8" fill="#FFFFFF" fill-opacity="0.9" />
    <!-- Middle Shelf -->
    <line x1="96" y1="320" x2="416" y2="320" />
    <!-- Shelf Items Row 2 -->
    <rect x="130" y="230" width="70" height="90" rx="8" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="220" y="240" width="60" height="80" rx="8" fill="#FFFFFF" fill-opacity="0.9" />
    <rect x="300" y="210" width="80" height="110" rx="8" fill="#FFFFFF" fill-opacity="0.9" />
    <!-- Vertical Supports -->
    <line x1="106" y1="120" x2="106" y2="380" />
    <line x1="406" y1="120" x2="406" y2="380" />
    <!-- Bottom Shelf Base -->
    <line x1="80" y1="380" x2="432" y2="380" stroke-width="32" />
    <!-- Scanner / Focus Reticle -->
    <circle cx="256" cy="256" r="160" stroke="#FFFFFF" stroke-width="12" stroke-dasharray="24 16" opacity="0.6" />
    <path d="M 180 256 L 230 256 M 282 256 L 332 256" stroke="#FFFFFF" stroke-width="8" opacity="0.8" />
  </g>
</svg>
